var _h = (location.hash || '').replace('#',''); if (['hoy','partidos','props','registro'].indexOf(_h) >= 0) S.tab = _h;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function f(x, d){ if (d === undefined) d = 1; if (x === null || x === undefined || isNaN(x)) return '-'; return Number(x).toFixed(d).replace('.', ',').replace('-', '−'); }

function gById(id){ for (var i=0;i<D.juegos.length;i++) if (D.juegos[i].id===id) return D.juegos[i]; return null; }

function sc(g){ return g.esc[clave(S.flags[g.id])] || g.esc[clave(g['def'])]; }
function scTodos(g){ var fl = g.cand.map(function(){return 1;}); return g.esc[clave(fl)] || null; }
function titulo(g){ return g.vis + ' @ ' + g.loc; }

function lineasEv(g, e){
  e = e || sc(g);
  return g.L.map(function(r,i){ var p = e.L[i]; var casa = 100/r.c; return {r:r, i:i, p:p, casa:casa, dif:(p===null?-99:p-casa)}; });
}
function mejorDe(g, tipo, e){
  var l = lineasEv(g, e).filter(function(x){ return x.r.t === tipo; });
  if (!l.length) return null;
  l.sort(function(a,b){ return b.dif - a.dif; });
  return l[0];
}
function cardClase(n){ return n ? 'card card-' + n : 'card'; }
function rowClase(n){ return n ? 'row-' + n : 'row'; }
function difTxt(d){ return (d >= 0 ? '+' : '') + f(d) + ' pts'; }
function bdg(n){ var b = NIVTXT[n]; return '<span class="'+b[1]+'">'+b[0]+'</span>'; }

function tarjetaLinea(g, x, mercado){
  var n = nivel(x.dif);
  return '<div class="'+cardClase(n)+'"><div class="hl-top"><span class="mk">'+esc(titulo(g))+' · '+mercado+'</span>'+bdg(n)+'</div>'+

    '<div class="sub">Simulador '+f(x.p,0)+' % · Casa '+f(x.casa,0)+' % · <b>'+difTxt(x.dif)+'</b></div>'+
    (n==='revisar' ? '<div class="nota">Se separa mucho de la casa: chequeá las bajas antes de apostar.</div>' : '')+'</div>';
}
function propsEv(g, e){
  e = e || sc(g);
  return g.P.map(function(r,i){
    var p = e.P[i]; var casa = 100/r.c;
    return {r:r, i:i, g:g, p:p, casa:casa, dif:(p===null?-99:p-casa), juega:(p!==null)};

function tarjetaProp(x){

function vistaHoy(){
  var h = '';

  D.juegos.forEach(function(g){ var e = sc(g); e.si.forEach(function(s){ si.push({g:g, s:s}); }); e.co.forEach(function(c){ co.push({g:g, c:c}); }); });

  return h;
}

function boxHtml(g){
  var e = sc(g), t0 = scTodos(g);
  var cambio = t0 && clave(S.flags[g.id]) !== clave(g.cand.map(function(){return 1;}));
  var h = '<div class="bx"><div class="bx-h"><span class="bx-team">'+(e.fuera.length ? 'Escenario: fuera '+esc(e.fuera.join(' · ')) : 'Escenario: todos juegan')+'</span></div>';

  if (cambio && t0) h += '<div class="esc">Con todos jugando: '+esc(proyTxt(g, t0))+'</div>';
  ['spread','total'].forEach(function(t){
    var x = mejorDe(g, t); if (!x) return;
    var n = nivel(x.dif); var t0x = t0 ? lineasEv(g, t0)[x.i] : null;

  });
  h += '</div>';
  [['visitante', g.vis], ['local', g.loc]].forEach(function(par){
    var rows = e.box[par[0]] || []; var tot = 0; rows.forEach(function(r){ tot += (r[2] || 0); });

      rows.map(function(r){ return '<div class="bx-r"><span class="bx-n">'+esc(r[0])+'</span><span>'+f(r[1],0)+'</span><span><b>'+f(r[2])+'</b></span><span>'+f(r[3])+'</span><span>'+f(r[4])+'</span><span>'+f(r[5])+'</span></div>'; }).join('')+'</div>';
  });
  h += '<div class="esc">Medianas de 10.000 simulaciones. Cambian con los botones del injury report. La suma de medianas no es la mediana del total.</div>';
  return h;
}

function vistaPartidos(){
  var h = D.juegos.map(function(g){

  var avail = MKS.filter(function(m){ return lines.some(function(x){ return x.r.st === m && x.juega; }); });
  if (!avail.length) return '<div class="pr-d"><div class="esc">Este jugador no tiene líneas jugables en este escenario.</div></div>';
  var st = avail.indexOf(S.pst) >= 0 ? S.pst : avail[0];
  var L = lines.filter(function(x){ return x.r.st === st && x.juega; }).sort(function(a,b){ return a.r.m - b.r.m; });
  var bi = 0; L.forEach(function(x,i){ if (x.dif > L[bi].dif) bi = i; });
  var k2 = key + '|' + st; var si = (S.pln[k2] === undefined || S.pln[k2] >= L.length) ? bi : S.pln[k2];
  var h = '<div class="pr-d"><div class="st4">'+avail.map(function(m){ return '<button class="pill'+(m===st?' pill-on':'')+'" style="padding:0 4px" onclick="pjSt(\''+m+'\')">'+STCORTO[m]+'</button>'; }).join('')+'</div>';
  h += '<div class="esc">Proyectado: <b>'+f(rowBox[COLBOX[st]])+'</b> '+STAT[st].toLowerCase()+' · tocá una línea para ver los últimos 5</div>';
  L.forEach(function(x,j){
    var n = nivel(x.dif);
    h += '<div class="ln'+(j===si?' ln-on':'')+'" onclick="pjLn(\''+k2.replace(/'/g,'')+'\','+j+')"><div class="row-l"><span class="ln-m">'+x.r.m+'+<span class="cuota">'+f(x.r.c,2)+'</span></span><span class="sub">Simulador '+f(x.p,0)+' % · Casa '+f(x.casa,0)+' %'+(j===bi?' · <b>mejor proyectada</b>':'')+'</span></div><div class="row-r">'+(n?bdg(n):'')+'<span class="diff">'+difTxt(x.dif)+'</span></div></div>';
  });
  var sel = L[si].r;
  if (sel.l5){
    h += '<div class="l5"><div class="sqs">'+sel.l5.map(function(v){ return '<div class="sq '+(v>=sel.m?'sq-si':'sq-no')+'">'+v+'</div>'; }).join('')+'</div><div class="hits">'+sel.h5+' de '+sel.l5.length+' últimos llegaron a '+sel.m+'+<br>Temporada: '+sel.ts[0]+' de '+sel.ts[1]+'</div></div>';
  } else h += '<div class="esc">Sin partidos de esta temporada todavía.</div>';
  return h + '</div>';
}

function vistaProps(){
  var g = gById(S.pg);
  var h = '<div class="pills">'+D.juegos.map(function(x){ return '<button class="pill'+(x.id===S.pg?' pill-on':'')+'" onclick="pjSet(\'pg\',\''+x.id+'\')">'+esc(x.vis+' @ '+x.loc)+'</button>'; }).join('')+'</div>';
  if (!g) return h;
  h += '<div class="pills">'+[['visitante',g.vis],['local',g.loc]].map(function(t){ return '<button class="pill'+(t[0]===S.ps?' pill-on':'')+'" onclick="pjSet(\'ps\',\''+t[0]+'\')">'+esc(t[1])+'</button>'; }).join('')+'</div>';
  if (g.cand.length) h += '<div class="card">'+chips(g)+'</div>';
  var e = sc(g), team = S.ps === 'local' ? g.loc : g.vis;
  var rows = (e.box && e.box[S.ps]) || [];
  var by = {}; propsEv(g, e).forEach(function(x){ (by[x.r.n] = by[x.r.n] || []).push(x); });
  var enBox = {}; rows.forEach(function(r){ enBox[r[0]] = 1; });
  h += '<div class="bx"><div class="bx-h"><span class="bx-team">'+esc(team)+'</span><span class="mk">'+(e.fuera.length ? 'Fuera: '+esc(e.fuera.join(' · ')) : 'Todos juegan')+'</span></div>'+
    '<div class="bx-r bx-th"><span>Jugador</span><span>MIN</span><span>PTS</span><span>REB</span><span>AST</span><span>3PT</span></div>';
  rows.forEach(function(r, i){
    var lines = by[r[0]] || [], abre = lines.length > 0, open = abre && S.pj === i;
    h += '<div class="bx-r pr-r" '+(abre ? 'onclick="pjAbrir('+i+')"' : '')+'><span class="bx-n">'+(abre ? (open ? '▾ ' : '▸ ') : '')+esc(r[0])+'</span><span>'+f(r[1],0)+'</span><span><b>'+f(r[2])+'</b></span><span>'+f(r[3])+'</span><span>'+f(r[4])+'</span><span>'+f(r[5])+'</span></div>';
    if (open) h += detalleProps(g, r[0], r, lines, g.id + '|' + S.ps + '|' + i);
  });
  var fuera = Object.keys(by).filter(function(n){ return !enBox[n] && by[n][0].r.eq === team; });
  if (fuera.length) h += '<div class="esc" style="padding-top:8px">Sin proyección en este escenario (OUT o sin minutos): '+esc(fuera.join(' · '))+'</div>';
  if (!rows.length) h += '<div class="esc">No hay box score para este equipo.</div>';
  h += '</div><div class="esc">Medianas de las simulaciones. Tocá un jugador para ver sus líneas, cómo las proyecta el simulador y sus últimos 5 partidos. Las líneas cambian con el injury report.</div>';
  return h;
}

function tarjetaReg(s){
  return '<div class="card"><div class="hl-top"><div class="g-t">'+esc(s.t)+'</div><div class="'+(String(s.u).charAt(0)==='+'?'pos':'neg')+'">'+esc(s.u)+'</div></div><div class="stats">'+
    '<div><div class="big">'+esc(s.ac)+'</div><div class="mk">aciertos</div></div><div><div class="big">'+esc(s.pct)+'</div><div class="mk">% de acierto</div></div><div><div class="big">'+esc(s.eq)+'</div><div class="mk">hace falta</div></div></div>'+
    (s.niveles ? '<div class="sub">'+esc(s.niveles)+'</div>' : '')+'</div>';
}
function vistaRegistro(){
  var R = D.reg;
  var regs = [['principal','Spread y total'],['props','Props'],['rec','Recomendadas'],['mias','Mis apuestas'],['hist','Historial']];
  var h = '<div class="pills">'+regs.map(function(r){ return '<button class="pill'+(r[0]===S.reg?' pill-on':'')+'" onclick="set(\'reg\',\''+r[0]+'\')">'+r[1]+'</button>'; }).join('')+'</div>';
  h += '<div class="esc">Motor v1 · desde el 24/11 · en unidades (1 apuesta = 1 u)</div>';
  if (!R) return h + '<div class="card vacio">Todavía no hay partidos medidos con el motor v1. El registro se llena cuando la 21e mide los partidos de cada día.</div>';
  if (S.reg === 'principal') h += (R.principal||[]).map(tarjetaReg).join('') || '<div class="card vacio">Todavía no hay partidos medidos.</div>';
  else if (S.reg === 'props'){
    var q = R.pregunta;
    if (q) h += '<div class="card q-card"><div class="mk">PREGUNTA PRINCIPAL</div><div class="g-t">'+esc(q.t)+'</div>'+
      '<div class="'+(q.est==='gris'?'q-n':'big')+'">'+esc(q.upa)+(q.upa==='-'?'':' <span class="mk">u por apuesta</span>')+'</div>'+
      '<div class="sub">Intervalo del 90 %: '+esc(q.ic)+' · '+q.n+' jugadas en '+q.par+' partidos</div><div class="est est-'+q.est+'">'+esc(q.tx)+'</div></div>';
    h += '<div class="pills">'+MKS.map(function(m){ return '<button class="pill'+(m===S.rmk?' pill-on':'')+'" onclick="set(\'rmk\',\''+m+'\')">'+STAT[m]+'</button>'; }).join('')+'</div>';
    h += '<div class="h2">'+STAT[S.rmk]+' · una jugada por jugador</div>';
    h += ((R.props||{})[S.rmk]||[]).map(function(w){
      return '<div class="card pr-row'+(w.est==='gris'?' gris':'')+'"><div class="hl-top"><b>'+esc(w.g)+'</b><span class="'+(w.est==='gris'?'q-n':(String(w.u).charAt(0)==='+'?'pos-s':'neg-s'))+'">'+esc(w.u)+'</span></div>'+
        '<div class="sub">'+esc(w.ac)+' · acierto '+esc(w.pct)+' · hace falta '+esc(w.eq)+'</div>'+
        (w.ic ? '<div class="sub">Por apuesta: <b>'+esc(w.upa)+'</b> · intervalo 90 %: '+esc(w.ic)+'</div>' : '')+
        '<div class="est est-'+w.est+'">'+esc(w.tx)+'</div></div>'; }).join('');
    if ((R.calib||[]).length) h += '<div class="card"><div class="g-t">Calibración del simulador</div><div class="esc">Una jugada por jugador, agrupadas por la probabilidad que dio el simulador. Si dice 60 % y sale cerca de 60 %, está bien calibrado.</div><div class="tr th" style="grid-template-columns:1fr 0.7fr 1fr 1fr"><span>Tramo</span><span>Jugadas</span><span>Simulador</span><span>Salió</span></div>'+
      R.calib.map(function(c){ return '<div class="tr" style="grid-template-columns:1fr 0.7fr 1fr 1fr"><span><b>'+esc(c.tramo)+'</b></span><span>'+c.n+'</span><span>'+esc(c.sim)+'</span><span>'+esc(c.real)+'</span></div>'; }).join('')+'</div>';
  }
  else if (S.reg === 'rec') h += (R.rec||[]).map(tarjetaReg).join('') || '<div class="card vacio">Las recomendadas se miden desde el 24/11 con lo que guarde la 21d.</div>';
  else if (S.reg === 'mias'){
    h += (R.mias||[]).map(tarjetaReg).join('') || '<div class="card vacio">Todavía no hay apuestas tuyas medidas.</div>';
    h += '<div class="card"><div class="g-t">Apuestas cargadas por el usuario</div>'+((R.bets||[]).map(function(b){ return '<div class="bet"><div class="row-l"><span class="sub"><b>'+esc(b.sel)+'</b><span class="cuota">'+esc(b.cuota)+'</span></span><span class="mk">'+esc(b.origen)+' · '+esc(b.fecha)+'</span></div><span class="'+(b.u==='pendiente'?'sub':(String(b.u).charAt(0)==='+'?'pos-s':'neg-s'))+'">'+esc(b.u)+'</span></div>'; }).join('') || '<div class="vacio">Todavía no hay apuestas cargadas.</div>')+'</div>';
  }
  else h += '<div class="card vacio">'+esc(R.hist || 'Acá queda todo lo anterior al motor v1 (hasta el 23/11). No se mezcla con el registro nuevo.')+'</div>';
  return h;
}

function render(){
  var tabs = [['hoy','Hoy'],['partidos','Partidos'],['props','Props'],['registro','Registro']];
  var body = S.tab==='hoy' ? vistaHoy() : S.tab==='partidos' ? vistaPartidos() : S.tab==='props' ? vistaProps() : vistaRegistro();
  var fecha = D.fecha.split('-');
  document.getElementById('app').innerHTML =
    '<div class="top"><h1 class="brand">Sims NBA</h1><div class="meta">'+fecha[2]+'/'+fecha[1]+' · '+D.juegos.length+' partidos<br>'+esc(D.motor)+'</div></div>'+
    '<div class="tabs">'+tabs.map(function(t){ return '<button class="tab'+(S.tab===t[0]?' tab-on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'; }).join('')+'</div>'+
    '<div class="body">'+body+'</div>';
}
render();
</script>
</body>
</html>
