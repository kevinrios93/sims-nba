}
var CRUCE_ST = {PTS:[['aro_prod','aro_perm','Pintura (aro)','mete'],['t_int_prod','t_int_perm','Triples','tira']], REB:[['orb_prod','orb_perm','Rebote ofensivo','tiene']], AST:[['ast_prod','ast_perm','Asistencias','da']], FG3M:[['t_int_prod','t_int_perm','Triples intentados','tira']]};
function dirRank(rp, rq){ var fv = (rp<=10?1:0)+(rq<=10?1:0), ct = (rp>=21?1:0)+(rq>=21?1:0); return (fv>0 && ct===0) ? 1 : (ct>0 && fv===0) ? -1 : 0; }
function cruceJug(g, team, st){
  var rk = g.rk || {}, rival = team === g.vis ? g.loc : g.vis, a = rk[team], b = rk[rival];
  if (!a || !b) return '';
  var out = [];
  (CRUCE_ST[st] || []).forEach(function(c){
    var sg = dirRank(a[c[0]][1], b[c[1]][1]);
    if (sg) out.push([Math.abs(11.5 - (a[c[0]][1] + b[c[1]][1]) / 2), [sg > 0 ? '+' : '-', c[2]+': '+team+' '+c[3]+' '+f(a[c[0]][0])+' (#'+a[c[0]][1]+') y '+rival+' permite '+f(b[c[1]][0])+' (#'+b[c[1]][1]+')']]);
  });
  out.sort(function(x, y){ return y[0] - x[0]; });
  if (!out.length) return '<div class="pq">Cruce con '+esc(rival)+': parejo (sin puestos extremos)</div>';
  return '<div class="esc">Cruce con '+esc(rival)+'</div>' + pqHtml(out.slice(0,2).map(function(x){ return x[1]; }));
}
function pjAbrirK(k){ S.pj = (S.pj === k ? null : k); render(); }
function boxEquipo(g, e, side, team){
  var rows = (e.box && e.box[side]) || [];
  var by = {}; propsEv(g, e).forEach(function(x){ (by[x.r.n] = by[x.r.n] || []).push(x); });
  var enBox = {}; rows.forEach(function(r){ enBox[r[0]] = 1; });
  var tot = 0; rows.forEach(function(r){ tot += (r[2] || 0); });
  var h = '<div class="bx"><div class="bx-h"><span class="bx-team">'+esc(team)+'</span><span class="mk">Suma de medianas '+f(tot,0)+' pts</span></div>'+
    '<div class="bx-r bx-th"><span>Jugador</span><span>MIN</span><span>PTS</span><span>REB</span><span>AST</span><span>3PT</span></div>';
  rows.forEach(function(r, i){
    var lines = by[r[0]] || [], abre = lines.length > 0, key = side+'|'+i, open = abre && S.pj === key;
    h += '<div class="bx-r pr-r" '+(abre ? 'onclick="pjAbrirK(\''+key+'\')"' : '')+'><span class="bx-n">'+(abre ? (open ? '▾ ' : '▸ ') : '')+esc(r[0])+'</span><span>'+f(r[1],0)+'</span><span><b>'+f(r[2])+'</b></span><span>'+f(r[3])+'</span><span>'+f(r[4])+'</span><span>'+f(r[5])+'</span></div>';
    if (open) h += detalleProps(g, r[0], r, lines, g.id+'|'+key, team);
  });
  var fuera = Object.keys(by).filter(function(n){ return !enBox[n] && by[n][0].r.eq === team; });
  if (fuera.length) h += '<div class="esc" style="padding-top:8px">Sin proyección en este escenario (OUT o sin minutos): '+esc(fuera.join(' · '))+'</div>';
  if (!rows.length) h += '<div class="esc">No hay box score para este equipo.</div>';
  return h + '</div>';
}
function vistaJuego(g){
  var e = sc(g);
  var h = '<button class="boxbtn" onclick="cerrarJuego()">← Partidos</button><div class="g-top"><div class="g-t">'+esc(titulo(g))+'</div><div class="hora">'+esc(g.hora||'')+'</div></div>';
  if (g.ya) h += '<div class="esc">YA JUGADO</div>';
  if (g.fijos) h += '<div class="esc">Minutos fijados a mano en este partido.</div>';
  // 1) injury report
  if (g.cand.length) h += '<div class="card">'+chips(g)+'</div>';
  h += '<div class="proj">Proyección: '+esc(proyTxt(g, e))+'</div>';
  // 2) recomendadas del partido
  h += '<div class="h2">Recomendadas de este partido</div>';
  if (!e.si.length && !e.co.length) h += '<div class="card vacio">No hay apuestas con ventaja para este partido.</div>';
  else {
    e.si.slice().sort(ordNiv).forEach(function(s){ h += tarjetaSimple(g, s, false); });
    if (!e.co.length) h += '<div class="card vacio">Sin combinada con ventaja en este partido.</div>';
    e.co.slice().sort(ordNiv).forEach(function(c){ h += tarjetaComb(g, c, false); });
  }
  // 3) spread, total y ganador
  h += '<div class="h2">Spread, total y ganador</div><div class="card">';
  var hay = false;
  [['spread','Spread'],['total','Total'],['ml','Ganador']].forEach(function(t){
    var x = mejorDe(g, t[0], e); if (!x) return; hay = true;
    var n = nivel(x.dif);
    h += '<div class="'+rowClase(n)+'"><div class="row-l"><span class="mk">'+t[1]+'</span><span class="sel">'+esc(x.r.sel)+'<span class="cuota">'+f(x.r.c,2)+'</span></span><span class="sub">Simulador '+f(x.p,0)+' % · Casa '+f(x.casa,0)+' %</span></div>'+
      '<div class="row-r">'+bdg(n)+'<span class="diff">'+difTxt(x.dif)+'</span></div></div>';
  });
  if (!hay) h += '<div class="vacio">Sin líneas de equipo para este partido.</div>';
  h += '</div><div class="esc">Colores: azul "a mirar" (3 a 5 pts) · naranja "fuerte" (5 a 12) · violeta "revisar" (más de 12)</div>';
  // 4) box score proyectado
  h += '<div class="h2">Box score proyectado</div><div class="esc">'+(e.fuera.length ? 'Fuera: '+esc(e.fuera.join(' · ')) : 'Todos juegan')+' · tocá un jugador para ver sus líneas, los últimos 5 y el cruce con el rival</div>';
  h += boxEquipo(g, e, 'visitante', g.vis) + boxEquipo(g, e, 'local', g.loc);
  h += '<div class="esc">Medianas de 10.000 simulaciones. Cambian con los botones del injury report. La suma de medianas no es la mediana del total.</div>';
  // 5) cruces de rankings
  return h + cruces(g);
}

function listaRec(){
  var si = [], co = [];
  D.juegos.forEach(function(g){ var e = sc(g); e.si.forEach(function(s){ si.push({g:g, s:s}); }); e.co.forEach(function(c){ co.push({g:g, c:c}); }); });
  return {si:si, co:co};
}
function vistaRec(){
  var L = listaRec(), si = L.si, co = L.co;
  var nf = si.filter(function(x){ return x.s.niv==='fuerte'; }).length + co.filter(function(x){ return x.c.niv==='fuerte'; }).length;
  var h = '<button class="boxbtn" onclick="verRec(false)">← Partidos</button><div class="g-t">Recomendadas del día</div>';
  h += '<div class="stats"><div class="card"><div class="big">'+si.length+'</div><div class="mk">simples</div></div><div class="card"><div class="big">'+nf+'</div><div class="mk">fuertes (simples y combinadas)</div></div><div class="card"><div class="big">'+co.length+'</div><div class="mk">combinadas</div></div></div>';
  h += '<div class="pills">'+[['simples','Simples'],['combinadas','Combinadas']].map(function(t){ return '<button class="pill'+(S.ht===t[0]?' pill-on':'')+'" onclick="set(\'ht\',\''+t[0]+'\')">'+t[1]+'</button>'; }).join('')+'</div>';
  h += '<div class="pills">'+[['todas','Todas'],['fuertes','Fuertes'],['medias','Medias']].map(function(t){ return '<button class="pill'+(S.hn===t[0]?' pill-on':'')+'" onclick="set(\'hn\',\''+t[0]+'\')">'+t[1]+'</button>'; }).join('')+'</div>';
  if (S.ht === 'simples') {
    var l = si.filter(function(x){ return pasaNiv(x.s.niv); }).sort(function(a,b){ return ordNiv(a.s, b.s); });
    h += l.length ? l.map(function(x){ return tarjetaSimple(x.g, x.s, true); }).join('') : '<div class="card vacio">No hay simples con este filtro.</div>';
  } else {
    var l2 = co.filter(function(x){ return pasaNiv(x.c.niv); }).sort(function(a,b){ return ordNiv(a.c, b.c); });
    h += l2.length ? l2.map(function(x){ return tarjetaComb(x.g, x.c, true); }).join('') : '<div class="card vacio">No hay combinadas con este filtro.</div>';
  }
  return h;
}
function vistaPartidos(){
  var h = '';
  if (D.faltan_apuestas && D.faltan_apuestas.length) h += '<div class="aviso"><b>Faltan tus apuestas del '+esc(D.faltan_apuestas.join(', '))+'.</b> Pasáselas a Sonnet, o decile "sin apuestas".</div>';
  if (S.rec) return h + vistaRec();
  if (S.hj) { var gj = gById(S.hj); if (gj) return h + vistaJuego(gj); }
  var L = listaRec();
  h += '<button class="recbtn" onclick="verRec(true)"><span>Recomendadas del día: '+(L.si.length + L.co.length)+'</span><span>›</span></button>';
  h += '<div class="h2">Partidos de hoy</div>' + D.juegos.map(function(g){
    var e = sc(g), n1 = e.si.length, n2 = e.co.length;
    return '<div class="ln" onclick="abrirJuego(\''+g.id+'\')"><div class="gl">'+(g.hora ? '<span class="hora">'+esc(g.hora)+'</span>' : '')+'<div class="row-l"><span class="ln-m">'+esc(titulo(g))+'</span><span class="sub">'+((n1||n2) ? n1+(n1===1?' simple':' simples')+' · '+n2+(n2===1?' combinada':' combinadas') : 'Sin ventaja')+(g.ya?' · YA JUGADO':'')+'</span></div></div>'+
      '<div class="row-r">'+(g.cand.length ? '<span class="mrk">Injury report</span>' : '')+'<span class="mk">›</span></div></div>';
  }).join('');
  return h;
}

function pjAbrir(i){ S.pj = (S.pj === i ? null : i); render(); }
function pjSet(k, v){ S[k] = v; S.pj = null; render(); }
function pjSt(m){ S.pst = m; render(); }
function pjLn(key, j){ S.pln[key] = j; render(); }
var COLBOX = {PTS:2, REB:3, AST:4, FG3M:5};
var STCORTO = {PTS:'Puntos', REB:'Rebotes', AST:'Asist.', FG3M:'Triples'};
function detalleProps(g, nombre, rowBox, lines, key, team){
  var avail = MKS.filter(function(m){ return lines.some(function(x){ return x.r.st === m && x.juega; }); });
  if (!avail.length) return '<div class="pr-d"><div class="esc">Este jugador no tiene líneas jugables en este escenario.</div></div>';
  var st = avail.indexOf(S.pst) >= 0 ? S.pst : avail[0];
  var L = lines.filter(function(x){ return x.r.st === st && x.juega; }).sort(function(a,b){ return a.r.m - b.r.m; });
  var bi = 0; L.forEach(function(x,i){ if (x.dif > L[bi].dif) bi = i; });
  var k2 = key + '|' + st; var si = (S.pln[k2] === undefined || S.pln[k2] >= L.length) ? bi : S.pln[k2];
  var h = '<div class="pr-d"><div class="st4">'+avail.map(function(m){ return '<button class="pill'+(m===st?' pill-on':'')+'" style="padding:0 4px" onclick="pjSt(\''+m+'\')">'+STCORTO[m]+'</button>'; }).join('')+'</div>';
  h += '<div class="esc">Proyectado: <b>'+f(rowBox[COLBOX[st]])+'</b> '+STAT[st].toLowerCase()+' · tocá una línea para ver los últimos 5</div>'+cruceJug(g, team, st);
  L.forEach(function(x,j){
    var n = nivel(x.dif);
    h += '<div class="ln'+(j===si?' ln-on':'')+'" onclick="pjLn(\''+k2.replace(/'/g,'')+'\','+j+')"><div class="row-l"><span class="ln-m">'+x.r.m+'+<span class="cuota">'+f(x.r.c,2)+'</span></span><span class="sub">Simulador '+f(x.p,0)+' % · Casa '+f(x.casa,0)+' %'+(j===bi?' · <b>mejor proyectada</b>':'')+'</span></div><div class="row-r">'+(n?bdg(n):'')+'<span class="diff">'+difTxt(x.dif)+'</span></div></div>';
  });
  var sel = L[si].r;
  if (sel.l5){
    h += '<div class="l5"><div class="sqs">'+sel.l5.map(function(v){ return '<div class="sq '+(v>=sel.m?'sq-si':'sq-no')+'">'+v+'</div>'; }).join('')+'</div><div class="hits">'+sel.h5+' de '+sel.l5.length+' últimos llegaron a '+sel.m+'+<br>Temporada: '+sel.ts[0]+' de '+sel.ts[1]+'</div></div>';
  } else h += '<div class="esc">Sin partidos de esta temporada todavía.</div>';
  return h + '</div>';
}

function tarjetaReg(s){
  return '<div class="card"><div class="hl-top"><div class="g-t">'+esc(s.t)+'</div><div class="'+(String(s.u).charAt(0)==='+'?'pos':'neg')+'">'+esc(s.u)+'</div></div><div class="stats">'+
    '<div><div class="big">'+esc(s.ac)+'</div><div class="mk">aciertos</div></div><div><div class="big">'+esc(s.pct)+'</div><div class="mk">% de acierto</div></div><div><div class="big">'+esc(s.eq)+'</div><div class="mk">hace falta</div></div></div>'+
    (s.niveles ? '<div class="sub">'+esc(s.niveles)+'</div>' : '')+'</div>';
}
function vistaRegistro(){
  var R = D.reg;
  var regs = [['principal','Spread y total'],['props','Props'],['rec','Recomendadas'],['mias','Mis apuestas'],['hist','Historial']];
  var h = '<div class="pills">'+regs.map(function(r){ return '<button class="pill'+(r[0]===S.reg?' pill-on':'')+'" onclick="set(\'reg\',\''+r[0]+'\')">'+r[1]+'</button>'; }).join('')+'</div>';
  h += '<div class="esc">Motor v1.3b desde el 27/11 (lo anterior es motor v1) · en unidades (1 apuesta = 1 u)</div>';
  if (!R) return h + '<div class="card vacio">Todavía no hay partidos medidos con el motor v1. El registro se llena cuando la 21e mide los partidos de cada día.</div>';
  if (S.reg === 'principal') h += (R.principal||[]).map(tarjetaReg).join('') || '<div class="card vacio">Todavía no hay partidos medidos.</div>';
  else if (S.reg === 'props'){
    var q = R.pregunta;
    if (q) h += '<div class="card q-card"><div class="mk">PREGUNTA PRINCIPAL</div><div class="g-t">'+esc(q.t)+'</div>'+
      '<div class="'+(q.est==='gris'?'q-n':'big')+'">'+esc(q.upa)+(q.upa==='-'?'':' <span class="mk">u por apuesta</span>')+'</div>'+
      '<div class="sub">Intervalo del 90 %: '+esc(q.ic)+' · '+q.n+' jugadas en '+q.par+' partidos</div><div class="est est-'+q.est+'">'+esc(q.tx)+'</div></div>';
    h += '<div class="pills">'+MKS.map(function(m){ return '<button class="pill'+(m===S.rmk?' pill-on':'')+'" onclick="set(\'rmk\',\''+m+'\')">'+STAT[m]+'</button>'; }).join('')+'</div>';
    h += '<div class="h2">'+STAT[S.rmk]+' · una jugada por jugador</div>';
    h += ((R.props||{})[S.rmk]||[]).map(function(w){
      return '<div class="card pr-row'+(w.est==='gris'?' gris':'')+'"><div class="hl-top"><b>'+esc(w.g)+'</b><span class="'+(w.est==='gris'?'q-n':(String(w.u).charAt(0)==='+'?'pos-s':'neg-s'))+'">'+esc(w.u)+'</span></div>'+
        '<div class="sub">'+esc(w.ac)+' · acierto '+esc(w.pct)+' · hace falta '+esc(w.eq)+'</div>'+
        (w.ic ? '<div class="sub">Por apuesta: <b>'+esc(w.upa)+'</b> · intervalo 90 %: '+esc(w.ic)+'</div>' : '')+
        '<div class="est est-'+w.est+'">'+esc(w.tx)+'</div></div>'; }).join('');
    if ((R.calib||[]).length) h += '<div class="card"><div class="g-t">Calibración del simulador</div><div class="esc">Una jugada por jugador, agrupadas por la probabilidad que dio el simulador. Si dice 60 % y sale cerca de 60 %, está bien calibrado.</div><div class="tr th" style="grid-template-columns:1fr 0.7fr 1fr 1fr"><span>Tramo</span><span>Jugadas</span><span>Simulador</span><span>Salió</span></div>'+
      R.calib.map(function(c){ return '<div class="tr" style="grid-template-columns:1fr 0.7fr 1fr 1fr"><span><b>'+esc(c.tramo)+'</b></span><span>'+c.n+'</span><span>'+esc(c.sim)+'</span><span>'+esc(c.real)+'</span></div>'; }).join('')+'</div>';
  }
  else if (S.reg === 'rec') h += (R.rec||[]).map(tarjetaReg).join('') || '<div class="card vacio">Las recomendadas se miden desde el 24/11 con lo que guarde la 21d.</div>';
  else if (S.reg === 'mias'){
    h += (R.mias||[]).map(tarjetaReg).join('') || '<div class="card vacio">Todavía no hay apuestas tuyas medidas.</div>';
    h += '<div class="card"><div class="g-t">Apuestas cargadas por el usuario</div>'+((R.bets||[]).map(function(b){ return '<div class="bet"><div class="row-l"><span class="sub"><b>'+esc(b.sel)+'</b><span class="cuota">'+esc(b.cuota)+'</span></span><span class="mk">'+esc(b.origen)+' · '+esc(b.fecha)+'</span></div><span class="'+(String(b.u).charAt(0)==='+'?'pos-s':'neg-s')+'">'+esc(b.u)+'</span></div>'; }).join('') || '<div class="vacio">Todavía no hay apuestas cargadas.</div>')+'</div>';
  }
  else h += '<div class="card vacio">'+esc(R.hist || 'Acá queda todo lo anterior al motor v1 (hasta el 23/11). No se mezcla con el registro nuevo.')+'</div>';
  return h;
}

function render(){
  var tabs = [['partidos','Partidos'],['registro','Registro']];
  var body = S.tab==='partidos' ? vistaPartidos() : vistaRegistro();
  var fecha = D.fecha.split('-');
  document.getElementById('app').innerHTML =
    '<div class="top"><h1 class="brand">Sims NBA</h1><div class="meta">'+fecha[2]+'/'+fecha[1]+' · '+D.juegos.length+' partidos<br>'+esc(D.motor)+'</div></div>'+
    '<div class="tabs">'+tabs.map(function(t){ return '<button class="tab'+(S.tab===t[0]?' tab-on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'; }).join('')+'</div>'+
    '<div class="body">'+body+'</div>';
}
render();
</script>
</body>
</html>
