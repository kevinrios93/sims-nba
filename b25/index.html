function detalleProps(g, nombre, rowBox, lines, key){

  else if (S.reg === 'mias'){
    h += (R.mias||[]).map(tarjetaReg).join('') || '<div class="card vacio">Todavía no hay apuestas tuyas medidas.</div>';
    h += '<div class="card"><div class="g-t">Apuestas cargadas por el usuario</div>'+((R.bets||[]).map(function(b){ return '<div class="bet"><div class="row-l"><span class="sub"><b>'+esc(b.sel)+'</b><span class="cuota">'+esc(b.cuota)+'</span></span><span class="mk">'+esc(b.origen)+' · '+esc(b.fecha)+'</span></div><span class="'+(String(b.u).charAt(0)==='+'?'pos-s':'neg-s')+'">'+esc(b.u)+'</span></div>'; }).join('') || '<div class="vacio">Todavía no hay apuestas cargadas.</div>')+'</div>';
  }
  else h += '<div class="card vacio">'+esc(R.hist || 'Acá queda todo lo anterior al motor v1 (hasta el 23/11). No se mezcla con el registro nuevo.')+'</div>';
  return h;
}

function render(){
  var tabs = [['hoy','Hoy'],['partidos','Partidos'],['props','Props'],['registro','Registro']];
  var body = S.tab==='hoy' ? vistaHoy() : S.tab==='partidos' ? vistaPartidos() : S.tab==='props' ? vistaProps() : vistaRegistro();
  var fecha = D.fecha.split('-');
  document.getElementById('app').innerHTML =
    '<div class="top"><h1 class="brand">Sims NBA</h1><div class="meta">'+fecha[2]+'/'+fecha[1]+' · '+D.juegos.length+' partidos<br>'+esc(D.motor)+'</div></div>'+
    '<div class="tabs">'+tabs.map(function(t){ return '<button class="tab'+(S.tab===t[0]?' tab-on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'; }).join('')+'</div>'+
    '<div class="body">'+body+'</div>';
}
render();
</script>
</body>
</html>
